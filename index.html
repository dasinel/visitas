<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>TapStars Visitas</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TapStars">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --brand:#4f46e5; --brand-ink:#fff;
  --shadow:0 6px 24px rgba(15,23,42,.18);
  --interesa:#16a34a; --volver:#f59e0b; --venta:#2563eb; --no:#dc2626; --noestaba:#6b7280;
}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--ink:#e8edf6;--mut:#94a3b8;--line:#263249;--brand:#818cf8;--brand-ink:#0b1220;--shadow:0 6px 24px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{background:var(--bg);font:inherit}
/* top */
#top{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
#top>*{pointer-events:auto}
.bar{display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;box-shadow:var(--shadow);height:46px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:0;min-width:0}
.search svg{flex:none;color:var(--mut)}
.who{flex:none;width:46px;height:46px;border-radius:14px;background:var(--brand);color:var(--brand-ink);border:0;box-shadow:var(--shadow);font-weight:700;font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:0;background:var(--card);padding:7px 11px;border-radius:999px;box-shadow:0 2px 10px rgba(15,23,42,.15);font-size:13px;font-weight:600;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip.off{opacity:.45}
.chip b{color:var(--mut);font-weight:600}
#results{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-top:8px;max-height:46vh;overflow:auto;display:none}
#results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px}
#results button:last-child{border:0}
#results small{display:block;color:var(--mut)}
/* fabs */
.fabs{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:500;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab{border:0;border-radius:50%;width:50px;height:50px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.fab.main{width:auto;height:56px;border-radius:28px;padding:0 20px 0 16px;background:var(--brand);color:var(--brand-ink);font-weight:700;display:flex;gap:8px;align-items:center;font-size:16px}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mut)}
#nav button.on{color:var(--brand)}
#nav .badge{position:absolute;margin:-4px 0 0 18px;background:var(--no);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
/* panels */
.panel{position:fixed;left:0;right:0;top:0;bottom:0;z-index:550;background:var(--bg);display:none;overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 84px)}
.panel.on{display:block}
.panel h1{font-size:22px;margin:0 0 4px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 8px}
.sub{color:var(--mut);margin:0 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.stat b{font-size:26px;display:block;line-height:1.1}
.stat span{color:var(--mut);font-size:13px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mut)}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--line)}
.tag.red{background:var(--no);color:#fff}.tag.amber{background:var(--volver);color:#111}
.empty{text-align:center;color:var(--mut);padding:32px 12px}
.listsearch{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;margin:8px 0}
/* sheet */
#backdrop{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:700;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:710;background:var(--card);border-radius:22px 22px 0 0;max-height:88dvh;overflow:auto;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .25s ease;box-shadow:var(--shadow)}
#sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sheet h3{margin:0 0 2px;font-size:20px}
label.l{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:16px}
textarea.in{min-height:76px;resize:vertical}
.est{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.est button{display:flex;gap:8px;align-items:center;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-weight:600;text-align:left}
.est button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.est button i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;background:var(--brand);color:var(--brand-ink);margin-top:16px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn.del{background:transparent;color:var(--no);border:1px solid var(--no)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0}
.note small{color:var(--mut);display:block}
/* adding mode */
#cross{position:fixed;left:50%;top:50%;z-index:520;width:40px;height:52px;margin:-52px 0 0 -20px;pointer-events:none;display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
#addbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:560;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;display:none}
#addbar p{margin:0 0 10px;font-weight:600;text-align:center}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:999px;padding:9px 16px;z-index:900;font-size:14px;display:none;box-shadow:var(--shadow)}
.pin{filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.me{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.leaflet-control-zoom{display:none}
.bar2{height:8px;border-radius:4px;background:var(--line);margin:8px 0 6px;overflow:hidden}.bar2>div{height:100%;background:var(--brand);border-radius:4px}
.big{font-size:30px;font-weight:800;line-height:1.1}
.mhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.mhead button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal .dn{text-align:center;font-size:11px;color:var(--mut);font-weight:700}
.cal button{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:1.15}
.cal button.has{background:color-mix(in srgb,var(--venta) 16%,var(--card));border-color:var(--venta);font-weight:700}
.cal button.sel{outline:2px solid var(--brand)}
.cal button.td{border-color:var(--brand);border-width:2px}
.cal button small{font-size:10px;color:var(--mut)}
.cal .e{border:0;background:none}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.card2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.8)}}
.leaflet-control-attribution{font-size:10px;margin-bottom:60px!important}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="bar">
    <form class="search" id="sform" autocomplete="off">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar un local o una calle…" enterkeyhint="search">
    </form>
    <button class="who" id="who" aria-label="Quién eres"></button>
  </div>
  <div id="results"></div>
  <div class="chips" id="chips"></div>
</div>

<div id="cross"></div>
<div id="addbar">
  <p>Mueve el mapa hasta que el pin esté sobre el local</p>
  <div class="row2"><button class="btn alt" id="addCancel" style="margin:0">Cancelar</button><button class="btn" id="addOk" style="margin:0">Poner pin aquí</button></div>
</div>

<div class="fabs" id="fabs">
  <button class="fab" id="locate" aria-label="Mi ubicación"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button class="fab main" id="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo local</button>
</div>

<section class="panel" id="pTasks"></section>
<section class="panel" id="pList"></section>
<section class="panel" id="pSales"></section>

<nav id="nav">
  <button data-tab="map" class="on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Mapa</button>
  <button data-tab="tasks"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 6"/></svg>Tareas<span class="badge" id="tbadge" style="display:none"></span></button>
  <button data-tab="list"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Locales</button>
  <button data-tab="sales"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Ventas</button>
</nav>

<div id="backdrop"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyA_QdQ9yVLbKmRLz2jwoM1s3t4cKGwTUGQ",authDomain:"tapstars-f10e9.firebaseapp.com",projectId:"tapstars-f10e9",storageBucket:"tapstars-f10e9.firebasestorage.app",messagingSenderId:"93539179901",appId:"1:93539179901:web:ac950e970f927349468014"};
const ESTADOS={
  interesa:{n:"Interesa",c:"var(--interesa)",hex:"#16a34a",ic:'<path d="m5 12 5 5L19 7"/>'},
  volver:{n:"Volver más tarde",c:"var(--volver)",hex:"#f59e0b",ic:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'},
  venta:{n:"Venta",c:"var(--venta)",hex:"#2563eb",ic:'<path d="M16.5 7.5A5.5 5.5 0 1 0 16.5 16.5M5 10.5h8M5 13.5h8"/>'},
  no:{n:"No interesa",c:"var(--no)",hex:"#dc2626",ic:'<path d="m6 6 12 12M18 6 6 18"/>'},
  noestaba:{n:"No había nadie",c:"var(--noestaba)",hex:"#6b7280",ic:'<path d="M6 12h12"/>'}
};
const svgIc=(k,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">${ESTADOS[k].ic}</svg>`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const fmtDate=s=>{if(!s)return"";const [y,m,d]=s.split("-");return `${+d}/${+m}`};
const fmtTs=t=>{const d=new Date(t);return `${d.getDate()}/${d.getMonth()+1} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2400)}
function dist(a,b){const R=6371e3,r=x=>x*Math.PI/180;const dx=r(b.lng-a.lng)*Math.cos(r((a.lat+b.lat)/2)),dy=r(b.lat-a.lat);return Math.sqrt(dx*dx+dy*dy)*R}
const fmtDist=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1)+" km";

/* ---------- state ---------- */
let locales=[],me=store.get("ts_user"),hidden=new Set(JSON.parse(store.get("ts_hidden")||"[]")),pos=null,markers={},addMode=false,pending=null;
const colRef=()=>db.collection("locales");
let ventas=[],cfg={stock:50,daniel:{weekCards:15},julia:{weekCards:10}},cal={y:new Date().getFullYear(),m:new Date().getMonth()},selDay=null;
const vRef=()=>db.collection("ventas");

/* ---------- firebase ---------- */
firebase.initializeApp(FB);
const db=firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let unsub=null;
firebase.auth().onAuthStateChanged(u=>{
  if(!u){firebase.auth().signInAnonymously().catch(e=>toast("No se pudo conectar: "+e.code));return}
  if(unsub)return;
  unsub=colRef().onSnapshot(s=>{locales=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},e=>toast("Error de datos: "+e.code));
  vRef().onSnapshot(s=>{ventas=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},e=>toast("Error de ventas: "+e.code));
  db.doc("config/metas").onSnapshot(s=>{if(s.exists)cfg={...cfg,...s.data()};renderAll()});
  seed();
});

async function seed(){
  try{
    const s=await db.doc("config/seed").get();
    if(s.exists)return;
    await db.doc("config/metas").set({stock:50,daniel:{weekCards:15},julia:{weekCards:10}},{merge:true});
    await vRef().doc("reserva-inicial").set({owner:"daniel",ts:1792700000000,qty:1,amount:20,cobrada:false,cobro:"2026-11-27",localName:"Venta del 22 oct",nota:"La paga cuando venga a Barcelona"});
    await db.doc("config/seed").set({done:true,ts:Date.now()});
  }catch(e){}
}

/* ---------- map ---------- */
const BCN=[41.3995,2.2060];
const map=L.map("map",{zoomControl:false,center:BCN,zoom:15,attributionControl:true});
const dark=matchMedia("(prefers-color-scheme: dark)");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
let meMarker=null,first=true;
function startGps(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(p=>{
    pos={lat:p.coords.latitude,lng:p.coords.longitude};
    if(!meMarker)meMarker=L.marker([pos.lat,pos.lng],{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:-100}).addTo(map);
    else meMarker.setLatLng([pos.lat,pos.lng]);
    if(first){first=false;map.setView([pos.lat,pos.lng],17)}
    renderTasks();
  },()=>{},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
$("locate").onclick=()=>{
  if(pos)map.flyTo([pos.lat,pos.lng],18,{duration:.6});
  else{toast("Activa la ubicación del móvil para esta app");startGps()}
};

const pinHtml=k=>`<svg class="pin" width="38" height="48" viewBox="0 0 38 48"><path d="M19 46C19 46 3 29.5 3 18.5A16 16 0 0 1 35 18.5C35 29.5 19 46 19 46Z" fill="${ESTADOS[k].hex}" stroke="#fff" stroke-width="2.5"/><g transform="translate(7 6.5) scale(1)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${ESTADOS[k].ic}</svg></g></svg>`;
function renderMarkers(){
  const ids=new Set();
  locales.forEach(l=>{
    if(typeof l.lat!=="number")return;
    ids.add(l.id);
    const show=!hidden.has(l.estado);
    let m=markers[l.id];
    const icon=L.divIcon({className:"",html:pinHtml(l.estado),iconSize:[38,48],iconAnchor:[19,46]});
    if(!m){m=markers[l.id]=L.marker([l.lat,l.lng],{icon}).on("click",()=>openDetail(l.id))}
    else{m.setLatLng([l.lat,l.lng]);m.setIcon(icon)}
    if(show&&!map.hasLayer(m))m.addTo(map);
    if(!show&&map.hasLayer(m))map.removeLayer(m);
  });
  Object.keys(markers).forEach(id=>{if(!ids.has(id)){map.removeLayer(markers[id]);delete markers[id]}});
}
function renderChips(){
  const cnt={};locales.forEach(l=>cnt[l.estado]=(cnt[l.estado]||0)+1);
  $("chips").innerHTML=Object.entries(ESTADOS).map(([k,e])=>`<button class="chip ${hidden.has(k)?"off":""}" data-k="${k}"><i style="background:${e.c}"></i>${e.n} <b>${cnt[k]||0}</b></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;hidden.has(k)?hidden.delete(k):hidden.add(k);store.set("ts_hidden",JSON.stringify([...hidden]));renderChips();renderMarkers()});
}

/* ---------- who ---------- */
function renderWho(){$("who").textContent=me==="julia"?"J":"D"}
function askWho(){
  openSheet(`<h3>¿Quién eres?</h3><p class="sub">Así sabremos quién visitó cada local.</p>
  <div class="row2"><button class="btn" data-w="daniel">Daniel</button><button class="btn" data-w="julia">Júlia</button></div>`);
  $("sheet").querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{me=b.dataset.w;store.set("ts_user",me);renderWho();closeSheet();renderAll()});
}

async function reverse(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=es&lat=${lat}&lon=${lng}`);
    const j=await r.json();const a=j.address||{};
    const street=[a.road||a.pedestrian||a.footway,a.house_number].filter(Boolean).join(" ");
    return {address:street||(j.display_name||"").split(",").slice(0,2).join(","),barrio:a.neighbourhood||a.suburb||a.quarter||"",name:j.name&&j.name!==a.road?j.name:""};
  }catch(e){return {address:"",barrio:"",name:""}}
}

  <button class="btn" id="fsave">Guardar local</button>`);
  const s=$("sheet");
  s.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{estado=b.dataset.e;s.querySelectorAll("[data-e]").forEach(x=>x.classList.toggle("on",x===b));$("fup").style.display=estado==="volver"?"block":"none";if(estado==="volver"&&!$("ffollow").value)$("ffollow").value=addDays(3)});
  s.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>$("ffollow").value=addDays(+b.dataset.d));

    $("fsave").disabled=true;

/* ---------- tasks ---------- */
function itemHtml(l,extra){

function bindItems(root){root.querySelectorAll(".item").forEach(b=>b.onclick=()=>{const l=locales.find(x=>x.id===b.dataset.id);if(!l)return;switchTab("map");map.setView([l.lat,l.lng],18);openDetail(l.id)})}
function renderTasks(){

  ${sec("Volver hoy o atrasados",due,l=>itemHtml(l,tag(l)))}

  ${sec("Próximos",soon,l=>itemHtml(l,tag(l)))}

const eur=n=>(Math.round(n*100)/100).toLocaleString("es-ES")+" €";
const S=(a,f)=>a.reduce((s,v)=>s+f(v),0);
const weekStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)).getTime();
const dayKey=ts=>ymd(new Date(ts));
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const plural=(n,a,b)=>n===1?a:b;
const PACKS=[{k:"a",l:"1 tarjeta · 20 €",q:1,a:20},{k:"b",l:"1 tarjeta · 25 €",q:1,a:25},{k:"c",l:"1 tarjeta · 30 €",q:1,a:30},{k:"d",l:"Pack 2 · 50 €",q:2,a:50},{k:"x",l:"Otro pack…"}];
function saleRow(v){

}
function renderSales(){
  const R=$("pSales"),now=new Date(),ws=weekStart(now),we=ws+7*864e5,t=today();

  const miss=locales.filter(l=>l.estado==="venta"&&!ventas.some(v=>v.localId===l.id));
  // calendar
  const first=new Date(cal.y,cal.m,1),off=(first.getDay()+6)%7,nd=new Date(cal.y,cal.m+1,0).getDate();
  const by={};ventas.forEach(v=>{const k=dayKey(v.ts);(by[k]=by[k]||[]).push(v)});
  let cells=["L","M","X","J","V","S","D"].map(d=>`<div class="dn">${d}</div>`).join("")+'<button class="e" disabled></button>'.repeat(off);
  for(let d=1;d<=nd;d++){
    const k=`${cal.y}-${pad(cal.m+1)}-${pad(d)}`,a=by[k]||[];
    cells+=`<button data-day="${k}" class="${a.length?"has":""} ${selDay===k?"sel":""} ${k===t?"td":""}">${d}${a.length?`<small>${S(a,v=>v.qty)}🎴</small>`:""}</button>`;
  }
  const mp=`${cal.y}-${pad(cal.m+1)}-`;
  const mv=ventas.filter(v=>dayKey(v.ts).startsWith(mp));
  const mEur=S(mv,v=>v.amount),mPaid=S(mv.filter(v=>v.cobrada),v=>v.amount);

  $("goals").onclick=openGoals;
}

  <div id="xtra" class="row2" style="display:none"><div><label class="l">Tarjetas</label><input class="in" type="number" id="xq" min="1" value="3"></div><div><label class="l">Total €</label><input class="in" type="number" id="xa" min="0" value="70"></div></div>
  <label class="l">Pago</label>
  <div class="est"><button type="button" data-p="1" class="on" style="--c:var(--interesa)">Cobrada ya</button><button type="button" data-p="0" style="--c:var(--volver)">Pendiente</button></div>
  <div id="pdate" style="display:none"><label class="l">Cobrar el…</label><input class="in" type="date" id="pd" value="${addDays(7)}"></div>
  <label class="l">Nota</label><input class="in" id="sn" placeholder="Opcional">
  <button class="btn" id="ssave">Guardar venta</button>`);
  const s=$("sheet");
  s.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pk=b.dataset.k;s.querySelectorAll("[data-k]").forEach(x=>x.classList.toggle("on",x===b));$("xtra").style.display=pk==="x"?"grid":"none"});
  s.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{paid=b.dataset.p==="1";s.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x===b));$("pdate").style.display=paid?"none":"block"});
  $("ssave").onclick=async()=>{
    if(!pk)return toast("Elige qué han comprado");
    let q,a;
    if(pk==="x"){q=+$("xq").value;a=+$("xa").value;if(!(q>0)||!(a>=0))return toast("Revisa tarjetas y total")}
    else{const p=PACKS.find(x=>x.k===pk);q=p.q;a=p.a}
    $("ssave").disabled=true;
    const v={owner:me,ts:Date.now(),qty:q,amount:a,cobrada:paid,cobro:paid?null:($("pd").value||null),localId:ctx.localId||null,localName:ctx.localName||"",nota:$("sn").value.trim()};
    try{
      await vRef().add(v);
      if(ctx.localId)await colRef().doc(ctx.localId).update({estado:"venta",followUp:null,updatedTs:Date.now()});
      closeSheet();toast("¡Venta apuntada! "+eur(a));
    }catch(e){$("ssave").disabled=false;toast("No se pudo guardar: "+e.code)}
  };
}
function openSaleDetail(id){
  const v=ventas.find(x=>x.id===id);if(!v)return;
  openSheet(`<h3>${v.qty} ${plural(v.qty,"tarjeta","tarjetas")} · ${eur(v.amount)}</h3><p class="sub">${esc(v.localName||"Sin local")} · ${esc(whoName(v.owner))} · ${fmtTs(v.ts)}</p>
  <div class="card2"><div class="kv"><span>Pago</span><b>${v.cobrada?"Cobrada":"Pendiente"+(v.cobro?" · "+fmtDate(v.cobro):"")}</b></div>${v.nota?`<div class="kv"><span>Nota</span><b>${esc(v.nota)}</b></div>`:""}</div>
  ${v.cobrada?"":'<button class="btn" id="vpay">Marcar como cobrada</button>'}
  ${v.localId?'<button class="btn alt" id="vmap">Ver en el mapa</button>':""}
  <button class="btn del" id="vdel">Eliminar venta</button>`);
  if($("vpay"))$("vpay").onclick=async()=>{try{await vRef().doc(id).update({cobrada:true,cobradaTs:Date.now()});closeSheet();toast("Cobrada")}catch(e){toast("No se pudo guardar")}};
  if($("vmap"))$("vmap").onclick=()=>{const l=locales.find(x=>x.id===v.localId);if(l){closeSheet();switchTab("map");map.setView([l.lat,l.lng],18)}};
  let armed=false;
  $("vdel").onclick=async()=>{if(!armed){armed=true;$("vdel").textContent="Pulsa otra vez para eliminar";return}
    try{await vRef().doc(id).delete();closeSheet();toast("Venta eliminada")}catch(e){toast("No se pudo eliminar")}};
}

/* ---------- tabs ---------- */
let tab="map";
function switchTab(t){
  tab=t;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("pTasks").classList.toggle("on",t==="tasks");$("pList").classList.toggle("on",t==="list");$("pSales").classList.toggle("on",t==="sales");
  ["top","fabs"].forEach(id=>$(id).style.visibility=t==="map"?"visible":"hidden");
  if(t==="map")setTimeout(()=>map.invalidateSize(),50);
  renderAll();
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

function renderAll(){renderMarkers();renderChips();renderTasks();if(tab==="list")renderList();if(tab==="sales")renderSales()}

/* ---------- boot ---------- */
renderWho();renderChips();startGps();
if(!me)setTimeout(askWho,400);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
